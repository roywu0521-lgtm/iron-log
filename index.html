<html lang="zh-Hant">
<head>

<title>鐵鍊日誌 Iron Log</title>
<style>
:root{color-scheme:dark;--bg:#10110f;--panel:#191a17;--raised:#20211d;--line:#35362d;--gold:#d9bc77;--gold-soft:#2f2b1e;--text:#f1f0e7;--muted:#a3a69a;--red:#edb1a6;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button{color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:10px 16px;transition:background .15s,border-color .15s}button:hover{background:#303128;border-color:#77745a}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}input,select,textarea{color:var(--text);background:#11130f;border:1px solid #45473b;border-radius:8px;padding:10px;max-width:100%;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}input[type=number]{width:85px}input[type=checkbox]{accent-color:var(--gold);width:21px;height:21px;cursor:pointer}input[type=date]{min-height:44px}label{display:block;color:var(--muted);font-size:13px}label>input,label>select{display:block;margin-top:6px;width:100%}h1,h2,h3,p{margin:0}h2{font-size:23px;letter-spacing:.02em}h3{font-size:17px}small,.muted{color:var(--muted)}small{font-size:12px}a{color:var(--gold)}.shell{max-width:1256px;margin:auto;padding:0 38px}.topbar{border-bottom:1px solid var(--line)}.topbar .shell{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:88px}.brand{display:flex;align-items:center;gap:12px}.mark{height:38px;width:38px;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font-size:24px;font-weight:800;transform:skew(-9deg)}.brand strong{font-size:20px;letter-spacing:.07em}.brand small{display:block;font-size:10px;letter-spacing:.24em}.top-note{font-size:12px;letter-spacing:.06em;color:var(--muted)}.dot{display:inline-block;width:6px;height:6px;background:var(--gold);border-radius:50%;margin-right:7px}.hero{display:flex;align-items:center;justify-content:space-between;gap:40px;padding:46px 0 32px}.eyebrow{font-size:11px;font-weight:650;letter-spacing:.22em;color:var(--gold);margin-bottom:13px}.hero h1{font-size:clamp(32px,4.4vw,53px);line-height:1.24;font-weight:750;letter-spacing:.015em}.hero h1 span{color:var(--gold)}.hero p{margin-top:16px;color:var(--muted)}.cycle-art{display:flex;align-items:center;gap:11px;padding:25px 0 25px 30px;border-left:1px solid var(--line)}.cycle-node{width:63px;text-align:center}.cycle-node b{display:block;font-size:24px;font-weight:600}.cycle-node span{color:var(--muted);font-size:10px;letter-spacing:.12em}.cycle-node.rest b{color:var(--muted)}.cycle-arrow{color:#76715a}.tabs{display:flex;gap:27px;border-bottom:1px solid var(--line);margin-bottom:28px}.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:16px 2px;color:var(--muted);font-weight:600;white-space:nowrap}.tab:hover{background:none;color:var(--text)}.tab.active{color:var(--gold);border-bottom-color:var(--gold)}.tab span{margin-right:8px;font-size:11px;opacity:.6}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.section-head p{font-size:13px;color:var(--muted);margin-top:5px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.primary{background:var(--gold);border-color:var(--gold);color:#191b15;font-weight:750}.primary:hover{background:#e8cd91;border-color:#e8cd91}.quiet{background:transparent}.small{padding:7px 11px;font-size:13px}.danger{color:var(--red)}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.day{text-align:left;padding:15px 14px;background:#131510;border-radius:12px;border:1px solid var(--line);min-height:120px;position:relative}.day small{display:block}.day strong{display:block;font-size:24px;font-weight:600;line-height:1.6}.day .day-kind{font-size:12px;color:var(--gold)}.day.selected{background:var(--gold);border-color:var(--gold);color:#1d2117}.day.selected small,.day.selected .day-kind{color:#4f513d}.day.today:after{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;position:absolute;right:12px;top:15px}.day.override:before{content:"已調整";position:absolute;right:8px;bottom:7px;font-size:9px;opacity:.65}.planner-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:20px}.day-title{display:flex;gap:14px;align-items:center}.badge{padding:6px 10px;background:var(--gold-soft);color:var(--gold);border:1px solid #494231;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.1em}.plan-list{display:grid;gap:10px}.exercise-line{display:flex;align-items:center;gap:15px;padding:16px 0;border-bottom:1px solid var(--line)}.exercise-number{font-size:14px;color:#81775d;min-width:22px;font-variant-numeric:tabular-nums}.exercise-info{flex:1;min-width:0;overflow-wrap:anywhere}.exercise-info small{display:block;margin-top:3px}.prescription{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.prescription label{font-size:10px}.prescription input{width:58px;padding:7px}.prescription .reps{width:78px}.icon-button{width:32px;height:32px;padding:0;font-size:17px;background:none}.add-line{width:100%;border-style:dashed;background:none;color:var(--gold);margin-top:20px}.side-panel h3{margin-bottom:10px}.side-panel p{color:var(--muted);font-size:13px;line-height:1.8}.side-panel form{margin-top:18px}.side-panel button{margin-top:12px;width:100%}.side-panel .aside-divider{border-top:1px solid var(--line);padding-top:18px;margin-top:23px}.footnote{color:var(--muted);font-size:12px;margin-top:16px}.week-actions{display:flex;gap:7px;align-items:center}.week-actions button{padding:6px 12px}.empty{text-align:center;padding:46px 15px;color:var(--muted)}.empty .empty-icon{font-size:35px;color:var(--gold);margin-bottom:12px}.empty p{margin:8px 0 20px}.library-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:19px}.search{flex:1;min-width:180px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.chip{padding:7px 17px;border-radius:30px;font-size:13px;background:none}.chip.active{background:var(--gold-soft);border-color:#8a784d;color:var(--gold)}.library-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.exercise-card{padding:21px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:17px}.exercise-card .card-top{display:flex;justify-content:space-between;align-items:center}.muscle-symbol{font-size:25px;color:#8a7a50;line-height:1}.exercise-card small{display:block;margin-top:4px}.exercise-card button{margin-top:auto;text-align:left;display:flex;justify-content:space-between;background:none;color:var(--gold)}.exercise-card button.added{color:var(--muted)}.target-strip{display:flex;justify-content:space-between;gap:10px;padding:13px 16px;background:var(--gold-soft);border:1px solid #494231;border-radius:10px;margin-bottom:20px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.stat strong{font-size:28px;color:var(--gold);display:block;font-variant-numeric:tabular-nums}.stat small{font-size:12px}.log-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}.log-card{border:1px solid var(--line);border-radius:12px;padding:19px;margin-bottom:15px;background:#151711}.log-card h3{margin-bottom:4px}.sets{width:100%;border-collapse:collapse;margin:15px 0 8px;table-layout:fixed}.sets th{font-weight:400;color:var(--muted);font-size:11px;text-align:center;padding:5px}.sets td{text-align:center;padding:7px 3px;font-variant-numeric:tabular-nums}.sets th:first-child{width:35px}.sets th:nth-last-child(2){width:56px}.sets th:last-child{width:32px}.sets input[type=number]{width:100%;max-width:110px;text-align:center;padding:7px 4px}.sets tr.done td:first-child{color:var(--gold)}.sets tr.done input[type=number]{border-color:#70613f}.note{width:100%;resize:vertical;min-height:95px;margin-top:8px}.history-item{display:block;text-align:left;width:100%;margin-top:10px;padding:13px}.history-item.active{border-color:var(--gold)}.history-item small{display:block}.status{font-size:12px;color:var(--muted)}.storage-warning{padding:12px 18px;background:#493426;color:#ffe2c6;margin-top:18px;border-radius:9px}footer{margin-top:44px;padding:24px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;letter-spacing:.03em}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--gold);color:#161910;padding:12px 22px;border-radius:10px;z-index:20;max-width:90vw;box-shadow:0 8px 30px #0006;font-weight:600}.hidden{display:none!important}dialog{background:var(--panel);border:1px solid #6f6447;border-radius:18px;color:var(--text);padding:28px;width:min(450px,calc(100% - 30px))}dialog::backdrop{background:#000a;backdrop-filter:blur(4px)}dialog h2{margin-bottom:18px}dialog label{margin-bottom:15px}dialog .row{justify-content:flex-end;margin-top:22px}.save-line{display:flex;align-items:center;gap:7px;margin-top:14px;color:var(--muted);font-size:11px}
@media(min-width:1400px){.hero{padding-top:55px;padding-bottom:40px}}
@media(max-width:960px){.shell{padding:0 24px}.hero{gap:20px}.cycle-art{gap:4px;padding-left:20px}.cycle-node{width:42px}.cycle-node b{font-size:20px}.planner-layout{grid-template-columns:minmax(0,1fr) 235px}.panel{padding:20px}.exercise-line{flex-wrap:wrap;gap:10px}.exercise-info{min-width:160px}.prescription{margin-left:32px}.library-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.log-layout{grid-template-columns:minmax(0,1fr) 220px}.day{padding:13px 10px}.day.override:before{display:none}}
@media(max-width:700px){.shell{padding:0 18px}.topbar .shell{min-height:76px}.top-note{display:none}.hero{padding:31px 0 25px;display:block}.hero h1{font-size:37px}.hero p{font-size:13px;max-width:290px}.cycle-art{display:none}.tabs{gap:25px;margin-bottom:22px}.tab{font-size:14px}.tab span{display:none}.section-head{align-items:flex-start;flex-wrap:wrap}.section-head h2{font-size:21px}.panel{padding:17px;border-radius:14px}.week{gap:5px}.day{padding:10px 3px;min-height:92px;text-align:center;border-radius:9px}.day strong{font-size:20px}.day small{font-size:10px}.day .day-kind{font-size:11px}.day.today:after{right:5px;top:5px;width:4px;height:4px}.planner-layout,.log-layout{grid-template-columns:1fr}.side-panel{order:2}.exercise-info{min-width:125px}.prescription{margin-left:31px}.exercise-line{gap:9px}.library-grid{grid-template-columns:1fr}.target-strip{flex-wrap:wrap}.stats{gap:8px}.stat{padding:14px 10px}.stat strong{font-size:23px}.stat small{font-size:11px}.sets th:nth-last-child(2){width:42px}.sets th:first-child{width:26px}.log-card{padding:13px}.log-layout .panel{padding:14px}.sets input[type=number]{font-size:16px}.sets th:last-child{width:29px}footer{display:block;margin-top:30px}footer span{display:block;margin-top:7px}.week-actions{width:100%;justify-content:flex-end}.day-title{gap:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="shell"><div class="brand"><div class="mark" aria-hidden="true">Ⅱ</div><div><strong>鐵鍊日誌</strong><small>IRON LOG / TRAINING JOURNAL</small></div></div><div class="top-note"><span class="dot"></span>專注訓練，累積每一組。</div></div></header>
<main class="shell">
<div id="storage-warning" class="storage-warning hidden" role="alert"></div>
<section class="hero"><div><div class="eyebrow">BUILT FOR YOUR NEXT REP</div><h1>把每一次努力，<br><span>記下來。</span></h1><p>你的推拉腿循環。你的節奏。你的訓練日誌。</p></div><div class="cycle-art" aria-label="推、拉、腿、休息，循環接續"><div class="cycle-node"><b>推</b><span>PUSH</span></div><span class="cycle-arrow">›</span><div class="cycle-node"><b>拉</b><span>PULL</span></div><span class="cycle-arrow">›</span><div class="cycle-node"><b>腿</b><span>LEGS</span></div><span class="cycle-arrow">›</span><div class="cycle-node rest"><b>休</b><span>REST</span></div><span class="cycle-arrow">↻</span></div></section>
<nav class="tabs" aria-label="主要功能"><button class="tab active" data-tab="plan" aria-current="page"><span>01</span>循環課表</button><button class="tab" data-tab="library"><span>02</span>動作庫</button><button class="tab" data-tab="log"><span>03</span>訓練紀錄</button><button class="tab" data-tab="body"><span>04</span>身體紀錄</button><button class="tab" data-tab="food"><span>05</span>飲食紀錄</button></nav>
<div id="view"></div>
<footer><span>IRON LOG　／　每一次紀錄，都是前進的痕跡。</span><span>資料僅儲存在此瀏覽器 · 不跨裝置同步</span></footer>
</main>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<dialog id="custom-dialog"><form id="custom-form"><h2>新增自己的動作</h2><label>動作名稱<input name="name" required maxlength="50" placeholder="例如：單手滑輪側平舉" autocomplete="off"></label><label>主要肌群<select name="muscle" id="custom-muscle"></select></label><label>使用器材<input name="equipment" required maxlength="30" placeholder="例如：滑輪機" autocomplete="off"></label><div class="row"><button type="button" data-action="close-custom">取消</button><button class="primary" type="submit">新增至動作庫</button></div></form></dialog>
<script>
'use strict';
const KEY='iron-log-v1';
const MUSCLES=['胸','背','肩','二頭','三頭','腿','臀','核心'];
const KINDS=['push','pull','legs','rest'];
const LABELS={push:'推日',pull:'拉日',legs:'腿日',rest:'休息'};
const ENGLISH={push:'PUSH',pull:'PULL',legs:'LEGS',rest:'REST'};
const FOCUS={push:'胸・肩・三頭',pull:'背・二頭',legs:'腿・臀',rest:'留一點空間，為下一輪準備。'};
const BUILTINS=[
['bench','槓鈴臥推','胸','槓鈴'],['incline','上斜啞鈴臥推','胸','啞鈴'],['fly','滑輪夾胸','胸','滑輪機'],
['lat','滑輪下拉','背','滑輪機'],['row','坐姿划船','背','滑輪機'],['pullup','引體向上','背','單槓'],
['press','啞鈴肩推','肩','啞鈴'],['lateral','啞鈴側平舉','肩','啞鈴'],['rear','反向飛鳥','肩','器械'],
['curl','啞鈴彎舉','二頭','啞鈴'],['hammer','槌式彎舉','二頭','啞鈴'],['triceps','繩索下壓','三頭','滑輪機'],['extension','過頭三頭伸展','三頭','滑輪機'],
['squat','槓鈴深蹲','腿','槓鈴'],['legpress','腿推','腿','器械'],['legcurl','腿後勾','腿','器械'],['calf','站姿提踵','腿','器械'],
['hip','臀推','臀','槓鈴'],['rdl','羅馬尼亞硬舉','臀','槓鈴'],['crunch','滑輪捲腹','核心','滑輪機'],['raise','懸垂舉腿','核心','單槓']
].map(([id,name,muscle,equipment])=>({id,name,muscle,equipment}));
const TEMPLATE={push:['bench','press','triceps'],pull:['lat','row','curl'],legs:['squat','legcurl','hip'],rest:[]};
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dayNumber(key){return Date.parse(key+'T00:00:00Z')/86400000;}
function dateValid(key){return typeof key==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(key)&&Number.isFinite(dayNumber(key))&&new Date(dayNumber(key)*86400000).toISOString().slice(0,10)===key;}
function addDays(key,n){return new Date((dayNumber(key)+n)*86400000).toISOString().slice(0,10);}
function monday(key){const weekday=new Date(dayNumber(key)*86400000).getUTCDay();return addDays(key,-((weekday+6)%7));}
function dateText(key){const [,m,d]=key.split('-');return `${Number(m)} 月 ${Number(d)} 日`;}
function kindAt(date,anchor){return KINDS[((dayNumber(date)-dayNumber(anchor))%4+4)%4];}
let state={version:2,weightUnit:'lb',anchor:todayKey(),overrides:{},custom:[],logs:{},body:[],meals:{}};
let storageOK=true;
let migrated=false;
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(![1,2].includes(saved.version)||!dateValid(saved.anchor)||!saved.overrides||Array.isArray(saved.overrides)||!saved.logs||Array.isArray(saved.logs)||!Array.isArray(saved.custom))throw Error('格式錯誤');if(saved.version===1){const next=clone(saved);for(const log of Object.values(next.logs)){for(const exercise of log.exercises){for(const set of exercise.sets){if(set.weight!==''&&Number.isFinite(Number(set.weight)))set.weight=String(Math.round(Number(set.weight)/0.45359237*10)/10);}}}next.version=2;next.weightUnit='lb';next.body=[];next.meals={};state=next;if(!localStorage.getItem(KEY+'-before-lb'))localStorage.setItem(KEY+'-before-lb',raw);localStorage.setItem(KEY,JSON.stringify(next));migrated=true;}else{if(saved.weightUnit!=='lb'||!Array.isArray(saved.body)||!saved.meals||Array.isArray(saved.meals))throw Error('格式錯誤');state=saved;}}}
catch{storageOK=false;showWarning('無法讀取既有儲存資料，目前使用暫存模式；不會覆蓋原有資料。');}
function showWarning(message){const el=document.getElementById('storage-warning');el.textContent=message;el.classList.remove('hidden');}
function save(){if(!storageOK)return false;try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch{storageOK=false;showWarning('瀏覽器無法儲存資料。目前操作只保留在本次開啟期間，關閉後可能遺失。');return false;}}
let selected=todayKey(),weekStart=monday(selected),tab='plan',filter='全部',search='',toastTimer;
function allExercises(){return [...BUILTINS,...state.custom];}
function getExercise(id){return allExercises().find(e=>e.id===id);}
function basePlan(kind){return {kind,items:TEMPLATE[kind].map(id=>({id,sets:3,reps:'8–12'}))};}
function planAt(date){return state.overrides[date]||basePlan(kindAt(date,state.anchor));}
function editablePlan(){if(!state.overrides[selected])state.overrides[selected]=clone(planAt(selected));return state.overrides[selected];}
function toast(message){const el=document.getElementById('toast');clearTimeout(toastTimer);el.textContent=message;el.classList.remove('hidden');toastTimer=setTimeout(()=>el.classList.add('hidden'),2800);}
function savedMessage(message){return storageOK?message:message+'（本次暫存）';}
function options(kind){return KINDS.map(k=>`<option value="${k}" ${kind===k?'selected':''}>${LABELS[k]}</option>`).join('');}
function changeTab(next){tab=next;render();}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});document.getElementById('view').innerHTML=tab==='plan'?renderPlan():tab==='library'?renderLibrary():tab==='log'?renderLog():tab==='body'?renderBody():renderFood();}
function renderPlan(){const plan=planAt(selected),end=addDays(weekStart,6);return `
<section class="panel"><div class="section-head"><div><div class="eyebrow">YOUR TRAINING CYCLE</div><h2>${dateText(weekStart)} — ${dateText(end)}</h2><p>${weekStart.slice(0,4)}${weekStart.slice(0,4)!==end.slice(0,4)?' / '+end.slice(0,4):''} · 推 → 拉 → 腿 → 休息，跨週接續</p></div><div class="week-actions"><button data-action="prev-week" aria-label="上一週">←</button><button data-action="today">今天</button><button data-action="next-week" aria-label="下一週">→</button></div></div><div class="week">${Array.from({length:7},(_,i)=>{const date=addDays(weekStart,i),p=planAt(date);return `<button class="day ${date===selected?'selected':''} ${date===todayKey()?'today':''} ${state.overrides[date]?'override':''}" data-action="select-date" data-date="${date}" aria-pressed="${date===selected}" aria-label="${date} ${LABELS[p.kind]}${date===todayKey()?' 今天':''}"><small>週${'一二三四五六日'[i]}</small><strong>${Number(date.slice(8))}</strong><span class="day-kind">${LABELS[p.kind]}</span></button>`;}).join('')}</div></section>
<div class="planner-layout"><section class="panel"><div class="section-head"><div class="day-title"><span class="badge">${ENGLISH[plan.kind]}</span><div><h2>${dateText(selected)}・${LABELS[plan.kind]}</h2><p>${FOCUS[plan.kind]}</p></div></div><label>當日安排<select id="day-kind" aria-label="當日訓練類型">${options(plan.kind)}</select></label></div>
${plan.items.length?`<div class="plan-list">${plan.items.map((item,i)=>{const e=getExercise(item.id);if(!e)return '';return `<div class="exercise-line"><span class="exercise-number">${String(i+1).padStart(2,'0')}</span><div class="exercise-info"><h3>${esc(e.name)}</h3><small>${esc(e.muscle)} / ${esc(e.equipment)}</small></div><div class="prescription"><label>組數<input type="number" min="1" max="20" step="1" value="${item.sets}" data-plan-index="${i}" data-plan-field="sets" aria-label="${esc(e.name)}預計組數"></label><label>目標次數<input class="reps" maxlength="15" value="${esc(item.reps)}" data-plan-index="${i}" data-plan-field="reps" aria-label="${esc(e.name)}目標次數"></label><button class="icon-button danger" data-action="remove-exercise" data-index="${i}" aria-label="移除${esc(e.name)}">×</button></div></div>`;}).join('')}</div>`:`<div class="empty"><div class="empty-icon">${plan.kind==='rest'?'↻':'＋'}</div><h3>${plan.kind==='rest'?'今天，留給恢復。':'從一個動作開始。'}</h3><p>${plan.kind==='rest'?'下一個循環，繼續累積。':'前往動作庫，建立你的當日課表。'}</p></div>`}
${plan.kind!=='rest'?'<button class="add-line" data-action="open-library">＋ 從動作庫加入動作</button>':''}
<div class="row between" style="margin-top:23px"><span class="status">${plan.items.length} 個動作 · ${plan.items.reduce((a,b)=>a+b.sets,0)} 組預計</span><button class="primary" data-action="start-log" ${!plan.items.length&&!state.logs[selected]?'disabled':''}>${state.logs[selected]?'繼續訓練紀錄':'開始記錄'} ↗</button></div><p class="footnote">內建安排為可編輯範例；組數與次數請依自己的課表調整。</p></section>
<aside class="panel side-panel"><div class="eyebrow">SET YOUR RHYTHM</div><h3>循環，由你開始。</h3><p>指定一個推日，往後依序排入拉日、腿日與休息日。</p><form id="anchor-form"><label>第一個推日<input type="date" id="anchor-date" required value="${state.anchor}" min="1900-01-01" max="2100-12-31"></label><button type="submit" class="quiet">更新循環起點 ↻</button></form><div class="aside-divider"><h3>週曆只是視角</h3><p>四天循環不受星期限制。當日調整只改當天，不會平移後續安排。更換起點會保留已調整日期與訓練紀錄。</p></div><div class="save-line"><span class="dot"></span>${storageOK?'變更會自動儲存於此瀏覽器':'目前為本次暫存模式'}</div></aside></div>`;}
function libraryCards(){const q=search.trim().toLowerCase(),list=allExercises().filter(e=>(filter==='全部'||e.muscle===filter)&&(`${e.name} ${e.equipment}`.toLowerCase().includes(q)));const plan=planAt(selected);return list.length?list.map(e=>{const added=plan.items.some(i=>i.id===e.id);return `<article class="exercise-card"><div class="card-top"><span class="badge">${esc(e.muscle)}</span><span class="muscle-symbol" aria-hidden="true">╋</span></div><div><h3>${esc(e.name)}</h3><small>${esc(e.equipment)}</small></div><button data-action="add-exercise" data-id="${esc(e.id)}" ${added?'disabled class="added"':''}><span>${added?'已在當日課表':'加入當日課表'}</span><span>${added?'✓':'＋'}</span></button></article>`;}).join(''):'<div class="empty">沒有符合的動作，試試其他關鍵字或新增自訂動作。</div>';}
function renderLibrary(){const p=planAt(selected);return `<div class="section-head"><div><div class="eyebrow">EXERCISE LIBRARY</div><h2>把動作，放進你的節奏。</h2><p>依肌群挑選，或加入你習慣的動作。</p></div><button class="quiet" data-action="open-custom">＋ 自訂動作</button></div><div class="target-strip"><span>加入目標：<strong>${dateText(selected)}・${LABELS[p.kind]}</strong></span><button class="small quiet" data-action="back-plan">回課表選日期 ↗</button></div><div class="library-tools"><input id="exercise-search" class="search" type="search" placeholder="搜尋動作或器材…" aria-label="搜尋動作或器材" value="${esc(search)}"></div><div class="chips">${['全部',...MUSCLES].map(m=>`<button class="chip ${filter===m?'active':''}" data-action="filter" data-filter="${m}" aria-pressed="${filter===m}">${m}</button>`).join('')}</div><div class="library-grid" id="library-grid">${libraryCards()}</div>`;}
function metrics(log){let count=0,volume=0,exercises=0;if(log)log.exercises.forEach(e=>{let hit=false;e.sets.forEach(s=>{if(s.done){count++;volume+=Number(s.weight)*Number(s.reps);hit=true;}});if(hit)exercises++;});return {count,volume,exercises};}
function historyHTML(){const dates=Object.keys(state.logs).sort().reverse();return `<aside class="panel"><div class="eyebrow">YOUR PROGRESS</div><h3>過往紀錄</h3><p class="footnote">點選日期繼續查看或編輯。</p>${dates.length?dates.map(d=>{const l=state.logs[d],m=metrics(l);return `<button class="history-item ${d===selected?'active':''}" data-action="history" data-date="${d}">${esc(d)} · ${LABELS[l.kind]}<small>${m.count} 組完成${m.count===0?' · 尚未完成組數':''}</small></button>`;}).join(''):'<p class="footnote">你的第一筆紀錄，從今天開始。</p>'}</aside>`;}
function renderLog(){const log=state.logs[selected],m=metrics(log);return `<div class="section-head"><div><div class="eyebrow">ONE REP AT A TIME</div><h2>${dateText(selected)}・訓練紀錄</h2><p>記下實際完成的每一組。</p></div><label>查看日期<input type="date" id="log-date" value="${selected}" min="1900-01-01" max="2100-12-31"></label></div><div class="stats"><div class="stat"><small>已完成組數</small><strong id="stat-sets">${m.count}<small> 組</small></strong></div><div class="stat"><small>已完成動作</small><strong id="stat-exercises">${m.exercises}<small> 個</small></strong></div><div class="stat"><small>已記錄負重總量</small><strong id="stat-volume">${m.volume.toLocaleString('zh-TW',{maximumFractionDigits:1})}<small> lb</small></strong></div></div><div class="log-layout"><section class="panel">${log?`<div class="section-head"><span class="badge">${ENGLISH[log.kind]} / ${selected}</span><span class="status" id="save-status">${storageOK?'自動儲存已啟用':'本次暫存'}</span></div>${log.exercises.map((e,i)=>`<article class="log-card"><h3>${esc(e.name)}</h3><small>課表目標 ${esc(e.target)} 次 / 組</small><table class="sets"><thead><tr><th scope="col">組</th><th scope="col">重量 lb</th><th scope="col">次數</th><th scope="col">完成</th><th scope="col"><span class="muted">刪除</span></th></tr></thead><tbody>${e.sets.map((s,j)=>`<tr class="${s.done?'done':''}"><td>${j+1}</td><td><input type="number" min="0" max="10000" step="0.1" inputmode="decimal" value="${esc(s.weight)}" data-e="${i}" data-s="${j}" data-field="weight" aria-label="${esc(e.name)}第${j+1}組重量"></td><td><input type="number" min="1" max="10000" step="1" inputmode="numeric" value="${esc(s.reps)}" data-e="${i}" data-s="${j}" data-field="reps" aria-label="${esc(e.name)}第${j+1}組次數"></td><td><input type="checkbox" ${s.done?'checked':''} data-e="${i}" data-s="${j}" data-field="done" aria-label="${esc(e.name)}第${j+1}組完成"></td><td><button class="icon-button danger" data-action="remove-set" data-e="${i}" data-s="${j}" aria-label="刪除${esc(e.name)}第${j+1}組">×</button></td></tr>`).join('')}</tbody></table><button class="small quiet" data-action="add-set" data-e="${i}">＋ 加一組</button></article>`).join('')}<label>今日筆記<textarea class="note" id="log-note" maxlength="2000" placeholder="例如：今天的感受、下次想調整的地方…">${esc(log.note)}</textarea></label><p class="footnote">重量單位為磅（lb），可填 0（徒手／未加重）。總量＝已完成組的輸入重量 × 次數；不含體重，也不自動換算雙側重量。請維持一致的記錄方式。</p>`:`<div class="empty"><div class="empty-icon">＋</div><h3>這一天，還沒有紀錄。</h3><p>先查看當日課表，再開始記錄。</p><button class="primary" data-action="back-plan">前往當日課表 ↗</button></div>`}</section>${historyHTML()}</div>`;}
function updateStats(){const m=metrics(state.logs[selected]);document.getElementById('stat-sets').innerHTML=`${m.count}<small> 組</small>`;document.getElementById('stat-exercises').innerHTML=`${m.exercises}<small> 個</small>`;document.getElementById('stat-volume').innerHTML=`${m.volume.toLocaleString('zh-TW',{maximumFractionDigits:1})}<small> lb</small>`;const status=document.getElementById('save-status');if(status)status.textContent=storageOK?'已儲存於此瀏覽器':'本次暫存';const history=document.querySelector('.log-layout > aside');if(history)history.outerHTML=historyHTML();}
function validSet(s){return s.weight!==''&&Number.isFinite(Number(s.weight))&&Number(s.weight)>=0&&Number(s.weight)<=10000&&s.reps!==''&&Number.isInteger(Number(s.reps))&&Number(s.reps)>0&&Number(s.reps)<=10000;}
function startLog(){const plan=planAt(selected);if(!state.logs[selected]){if(!plan.items.length){toast('先在當日課表加入動作。');return;}state.logs[selected]={kind:plan.kind,note:'',exercises:plan.items.map(item=>({id:item.id,name:getExercise(item.id).name,target:item.reps,sets:Array.from({length:item.sets},()=>({weight:'',reps:'',done:false}))}))};}save();changeTab('log');}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){changeTab(b.dataset.tab);return;}const a=b.dataset.action;if(!a)return;
if(a==='select-date'){selected=b.dataset.date;render();}
if(a==='prev-week'||a==='next-week'){const shift=a==='prev-week'?-7:7;weekStart=addDays(weekStart,shift);selected=addDays(selected,shift);render();}
if(a==='today'){selected=todayKey();weekStart=monday(selected);render();}
if(a==='open-library')changeTab('library');
if(a==='back-plan'){weekStart=monday(selected);changeTab('plan');}
if(a==='filter'){filter=b.dataset.filter;render();}
if(a==='remove-exercise'){const i=Number(b.dataset.index);editablePlan().items.splice(i,1);save();render();toast(savedMessage('已從當日課表移除'));}
if(a==='add-exercise'){if(planAt(selected).kind==='rest'){toast('這天是休息日，請先回課表調整當日安排。');return;}const plan=editablePlan();if(!plan.items.some(i=>i.id===b.dataset.id))plan.items.push({id:b.dataset.id,sets:3,reps:'8–12'});save();render();toast(savedMessage('已加入 '+dateText(selected)+' 的課表'));}
if(a==='start-log')startLog();
if(a==='history'){selected=b.dataset.date;render();}
if(a==='add-set'){state.logs[selected].exercises[Number(b.dataset.e)].sets.push({weight:'',reps:'',done:false});save();render();}
if(a==='remove-set'){const sets=state.logs[selected].exercises[Number(b.dataset.e)].sets,s=sets[Number(b.dataset.s)];if((s.weight!==''||s.reps!==''||s.done)&&!confirm('刪除這一組已輸入的紀錄？'))return;sets.splice(Number(b.dataset.s),1);save();render();}
if(a==='open-custom'){document.getElementById('custom-form').reset();document.getElementById('custom-dialog').showModal();}
if(a==='close-custom')document.getElementById('custom-dialog').close();
});
document.addEventListener('change',event=>{const el=event.target;
if(el.id==='day-kind'){const old=planAt(selected);if(old.items.length&&!confirm('替換這一天的課表為所選類型的範例？已儲存的訓練紀錄不會改變。')){el.value=old.kind;return;}state.overrides[selected]=basePlan(el.value);save();render();}
if(el.dataset.planField){const plan=editablePlan(),item=plan.items[Number(el.dataset.planIndex)];if(el.dataset.planField==='sets'){if(!el.checkValidity()||!el.value||!Number.isInteger(Number(el.value))){toast('組數請填 1 到 20 的整數。');el.value=item.sets;return;}item.sets=Number(el.value);}else{if(!el.value.trim()){toast('請填寫目標次數。');el.value=item.reps;return;}item.reps=el.value.trim();}save();render();}
if(el.id==='log-date'){if(dateValid(el.value)&&el.checkValidity()){selected=el.value;render();}}
if(el.dataset.field==='done'){const s=state.logs[selected].exercises[Number(el.dataset.e)].sets[Number(el.dataset.s)];if(el.checked&&!validSet(s)){el.checked=false;toast('先填入有效重量與次數，再標記完成。');return;}s.done=el.checked;el.closest('tr').classList.toggle('done',s.done);save();updateStats();}
});
document.addEventListener('input',event=>{const el=event.target;
if(el.id==='exercise-search'){search=el.value;document.getElementById('library-grid').innerHTML=libraryCards();}
if(el.id==='log-note'){state.logs[selected].note=el.value;save();updateStats();}
if(el.dataset.field==='weight'||el.dataset.field==='reps'){const s=state.logs[selected].exercises[Number(el.dataset.e)].sets[Number(el.dataset.s)];s[el.dataset.field]=el.checkValidity()?el.value:'';if(s.done&&!validSet(s)){s.done=false;el.closest('tr').querySelector('[data-field="done"]').checked=false;el.closest('tr').classList.remove('done');}save();updateStats();}
});
document.addEventListener('submit',event=>{if(event.target.id==='anchor-form'){event.preventDefault();const el=document.getElementById('anchor-date');if(!dateValid(el.value)||!el.checkValidity())return;state.anchor=el.value;save();render();toast(savedMessage('已更新循環；自訂日期與紀錄保留'));}
if(event.target.id==='custom-form'){event.preventDefault();const data=new FormData(event.target),name=String(data.get('name')).trim(),equipment=String(data.get('equipment')).trim();if(!name||!equipment){toast('請填寫動作名稱與器材。');return;}state.custom.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name,muscle:String(data.get('muscle')),equipment});filter=String(data.get('muscle'));search='';save();document.getElementById('custom-dialog').close();render();toast(savedMessage('已新增至動作庫；可再加入當日課表'));}
});
document.getElementById('custom-muscle').innerHTML=MUSCLES.map(m=>`<option>${m}</option>`).join('');
render();
</script>

ight:70vh;border:0;margin-top:15px}.report-dialog h2{overflow-wrap:anywhere;font-size:18px}.form-grid fieldset{border:0;padding:0;margin:0;min-width:0}.file-name{overflow-wrap:anywhere;color:var(--text)}.health-form fieldset{border:0;padding:0;margin:0;min-width:0}.health-form fieldset:disabled{opacity:.65}.save-actions{margin-top:20px}.migration-note{padding:12px 17px;border:1px solid #685b3d;background:var(--gold-soft);border-radius:10px;margin-top:18px;font-size:13px;color:var(--gold)}

<dialog id="report-dialog" class="report-dialog"><div class="row between"><h2 id="report-title">原始報告</h2><button type="button" data-health="close-report">關閉</button></div><div id="report-content"></div><a id="report-download" download>下載原始報告</a></dialog>
<script>
// Personal records stay in this browser. OCR libraries/models are downloaded on demand.
const KG_PER_LB=0.45359237;
const BODY_FIELDS=[['weight','體重',0.1,1500],['muscle','骨骼肌量',0.1,1000],['fat','體脂率（%）',0,100],['bmi','BMI',0.1,200],['waist','腰圍（cm）',0.1,500]];
const MEAL_TYPES=['早餐','午餐','晚餐','點心','訓練前／後'];
const NUTRIENTS=[['kcal','熱量','kcal'],['protein','蛋白質','g'],['carbs','碳水化合物','g'],['fat','脂肪','g']];
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
const round1=n=>Math.round(n*10)/10;
function freshBody(){return {id:'',date:todayKey(),unit:'lb',weight:'',muscle:'',fat:'',bmi:'',waist:'',note:'',reportId:'',reportName:'',ocrText:'',ocrStatus:'',needsReview:false,reviewed:false};}
function freshMeal(){return {id:'',type:'早餐',food:'',portion:'',kcal:'',protein:'',carbs:'',fat:'',note:''};}
let bodyDraft=freshBody(),mealDraft=freshMeal(),mealDate=todayKey(),pendingReport=null,bodySaving=false,ocrJob=null,reportURL=null;
const tempReports=new Map();
let reportDBPromise;
function openReportDB(){if(!reportDBPromise)reportDBPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('iron-log-reports',1);req.onupgradeneeded=()=>req.result.createObjectStore('reports',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('附件資料庫被其他視窗占用'));}).catch(e=>{reportDBPromise=null;throw e;});return reportDBPromise;}
async function reportStore(action,id,file){const db=await openReportDB();return new Promise((resolve,reject)=>{const tx=db.transaction('reports',action==='get'?'readonly':'readwrite'),store=tx.objectStore('reports');const req=action==='put'?store.put({id,file}):action==='delete'?store.delete(id):store.get(id);let result;req.onsuccess=()=>{result=req.result;};tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('附件儲存中斷'));});}
function displayBodyValue(r,key){return r[key]===''||r[key]===undefined?'—':`${esc(r[key])}${key==='weight'||key==='muscle'?' '+esc(r.unit):key==='fat'?' %':key==='waist'?' cm':''}`;}

function parseInBody(text){const lines=text.normalize('NFKC').replace(/([\u3400-\u9fff])\s+(?=[\u3400-\u9fff])/g,'$1').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const patterns={weight:/(?:體重|体重|\bWeight\b)/i,muscle:/(?:骨骼肌(?:重|量)?|Skeletal\s*Muscle\s*Mass|\bSMM\b)/i,fat:/(?:體脂肪率|体脂肪率|體脂率|体脂率|Percent\s*Body\s*Fat|Body\s*Fat\s*(?:Percentage|Percent)|\bPBF\b)/i,bmi:/\bBMI\b|身體質量指數|身体质量指数/i};const result={},evidence={};let foundUnit='';
for(const [key,regex] of Object.entries(patterns)){const candidates=[];for(let i=0;i<lines.length;i++){const line=lines[i],match=regex.exec(line);if(!match)continue;if(key==='weight'&&/(target|ideal|control|目標|标准|標準|控制|調整)/i.test(line))continue;let tail=line.slice(match.index+match[0].length);if(Object.entries(patterns).some(([k,r])=>k!==key&&r.test(tail)))tail=tail.split(/體脂|体脂|骨骼|Skeletal|\bSMM\b|\bPBF\b|\bBMI\b|\bWeight\b/i)[0];tail=tail.replace(/[（(\[][^[\]()（）]*\d\s*[-–~～][^[\]()（）]*[）)\]]/g,'');let values=tail.match(/\d+(?:[.,]\d+)?/g)||[];if(values.length===0&&i+1<lines.length&&/^[\s:：|]*(?:\d+(?:[.,]\d+)?)[\s%()a-z公斤磅]*$/i.test(lines[i+1])){tail=lines[i+1];values=tail.match(/\d+(?:[.,]\d+)?/g)||[];}if(values.length!==1||/[-−]\s*\d/.test(tail))continue;const n=Number(values[0].replace(',','.'));const max=key==='fat'?100:key==='bmi'?200:key==='weight'?1500:1000;if(!Number.isFinite(n)||n<0||n>max||(n===0&&key!=='fat'))continue;const unit=/\b(?:lb|lbs)\b|磅/i.test(line+' '+tail)?'lb':/\bkg\b|公斤/i.test(line+' '+tail)?'kg':'';candidates.push({n,unit,line});}
const distinct=[...new Set(candidates.map(c=>c.n))];if(distinct.length===1){result[key]=String(round1(distinct[0]));evidence[key]=candidates[0].line;if(key==='weight'||key==='muscle'){const units=[...new Set(candidates.map(c=>c.unit).filter(Boolean))];if(units.length===1){if(foundUnit&&foundUnit!==units[0])foundUnit='mixed';else if(foundUnit!=='mixed')foundUnit=units[0];}}}}

const scripts=new Map();
function loadScript(url){if(scripts.has(url))return scripts.get(url);const p=new Promise((resolve,reject)=>{const script=document.createElement('script');const timer=setTimeout(()=>{script.remove();reject(Error('辨識工具下載逾時，請確認網路後重試。'));},45000);script.src=url;script.referrerPolicy='no-referrer';script.onload=()=>{clearTimeout(timer);resolve();};script.onerror=()=>{clearTimeout(timer);script.remove();reject(Error('無法下載辨識工具，請確認網路後重試。'));};document.head.appendChild(script);}).catch(e=>{scripts.delete(url);throw e;});scripts.set(url,p);return p;}
function ocrProgress(message){bodyDraft.ocrStatus=message;const el=document.getElementById('ocr-status');if(el)el.textContent=message;}
function ensureJob(job){if(job.cancelled)throw Error('已取消辨識。');}
async function getOCRWorker(job){ensureJob(job);if(job.worker)return job.worker;await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js');ensureJob(job);ocrProgress('正在載入中英文辨識模型，首次使用可能需要一至兩分鐘…');const worker=await Tesseract.createWorker(['chi_tra','eng'],1,{logger:m=>{if(!job.cancelled&&m.status==='recognizing text')ocrProgress(`正在辨識報告${job.pageLabel||''}… ${Math.round((m.progress||0)*100)}%`);}});if(job.cancelled){await worker.terminate();ensureJob(job);}job.worker=worker;await worker.setParameters({tessedit_pageseg_mode:'3',preserve_interword_spaces:'1'});return worker;}
async function recognizeCanvas(job,image){const worker=await getOCRWorker(job);ensureJob(job);const result=await worker.recognize(image);ensureJob(job);return result.data.text||'';}
async function imageCanvas(file){const url=URL.createObjectURL(file);try{const image=new Image();image.src=url;await image.decode();const scale=Math.min(2,2400/Math.max(image.naturalWidth,image.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas;}finally{URL.revokeObjectURL(url);}}
function pdfTextLines(items){const lines=[];for(const item of items){if(!item.str?.trim())continue;const y=item.transform[5];let line=lines.find(l=>Math.abs(l.y-y)<3);if(!line){line={y,items:[]};lines.push(line);}line.items.push(item);}return lines.sort((a,b)=>b.y-a.y).map(l=>l.items.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')).join('\n');}
async function extractReport(job,file){if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name))return recognizeCanvas(job,await imageCanvas(file));ocrProgress('正在載入 PDF 讀取工具…');const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.mjs');ensureJob(job);pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.worker.mjs';const task=pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false});job.pdfTask=task;task.onPassword=()=>{task.destroy();job.reject(Error('PDF 有密碼保護，請改用未加密的報告或圖片。'));};const pdf=await task.promise;ensureJob(job);if(pdf.numPages>5)throw Error('PDF 超過 5 頁，請先另存需要的量測頁再上傳。');const texts=[];for(let n=1;n<=pdf.numPages;n++){ensureJob(job);ocrProgress(`正在讀取 PDF 第 ${n} / ${pdf.numPages} 頁…`);const page=await pdf.getPage(n),text=pdfTextLines((await page.getTextContent()).items);texts.push(text);const count=['weight','muscle','fat'].filter(k=>parseInBody(text).values[k]!==undefined).length;if(count<3){const viewport=page.getViewport({scale:Math.min(2.5,2400/Math.max(page.view[2]-page.view[0],page.view[3]-page.view[1]))}),canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;job.pageLabel=`第 ${n} / ${pdf.numPages} 頁`;texts.push(await recognizeCanvas(job,canvas));canvas.width=canvas.height=1;}}return texts.join('\n');}
async function beginOCR(file){if(ocrJob||bodySaving)return;if(!file)return;if(!['image/jpeg','image/png','image/webp','application/pdf'].includes(file.type)&&!(/\.pdf$/i.test(file.name)&&!file.type)){toast('請選擇 JPG、PNG、WebP 或 PDF。');return;}if(file.size>15*1024*1024){toast('單份報告最多 15 MB，請先縮小檔案。');return;}pendingReport=file;bodyDraft.reportName=file.name;bodyDraft.ocrText='';bodyDraft.needsReview=true;bodyDraft.reviewed=false;for(const k of ['weight','muscle','fat','bmi'])bodyDraft[k]='';bodyDraft.ocrStatus='準備辨識…';const job={cancelled:false,worker:null,pdfTask:null};ocrJob=job;const abort=new Promise((_,reject)=>{job.reject=reject;});const timer=setTimeout(()=>{job.cancelled=true;job.reject(Error('辨識超過 3 分鐘，請重試較清楚的報告，或手動填寫。'));job.worker?.terminate();},180000);if(tab==='body')render();try{const text=await Promise.race([extractReport(job,file),abort]);ensureJob(job);bodyDraft.ocrText=text.slice(0,40000);const parsed=parseInBody(text).values;Object.assign(bodyDraft,parsed);const count=['weight','muscle','fat','bmi'].filter(k=>parsed[k]!==undefined).length;bodyDraft.ocrStatus=count?`已讀取 ${count} 個數據欄位。請核對日期、單位與數字後再儲存。${parsed.unit?' 報告重量單位：'+parsed.unit+'。':' 未確認報告重量單位，請手動選擇。'}${parsed.date?'':' 量測日期未讀取，請手動確認。'}`:'尚未找到可確認的數字。可查看辨識原文、改用清楚的圖片，或手動填寫；原始報告仍可留存。';}catch(e){bodyDraft.ocrStatus=e.message||'辨識失敗，請重試或手動填寫。';}finally{clearTimeout(timer);job.cancelled=true;if(job.worker)await job.worker.terminate().catch(()=>{});if(job.pdfTask)await job.pdfTask.destroy().catch(()=>{});if(ocrJob===job)ocrJob=null;if(tab==='body')render();}}
function cancelOCR(){if(!ocrJob)return;ocrJob.cancelled=true;ocrJob.reject(Error('已取消辨識。可重新選擇報告或手動填寫。'));}
async function saveBody(form){if(ocrJob||bodySaving||!form.reportValidity())return;if(!dateValid(bodyDraft.date)){toast('請填寫有效日期。');return;}const hasData=BODY_FIELDS.some(([k])=>bodyDraft[k]!=='');if(!hasData&&!pendingReport&&!bodyDraft.reportId){toast('請填寫至少一項身體數據，或選擇一份報告。');return;}bodySaving=true;render();const record=clone(bodyDraft);delete record.ocrStatus;delete record.reviewed;record.id=record.id||uid();let newFileId=null;try{if(pendingReport){newFileId=uid();await reportStore('put',newFileId,pendingReport);record.reportId=newFileId;record.reportName=pendingReport.name;}const index=state.body.findIndex(r=>r.id===record.id),old=index>=0?state.body[index]:null;if(index>=0)state.body[index]=record;else state.body.push(record);const persisted=save();if(!persisted&&pendingReport)tempReports.set(newFileId,pendingReport);if(persisted&&old?.reportId&&old.reportId!==record.reportId)await reportStore('delete',old.reportId).catch(()=>{});bodyDraft=freshBody();pendingReport=null;toast(savedMessage('身體紀錄已儲存'));}catch{if(newFileId)await reportStore('delete',newFileId).catch(()=>{});toast('報告無法儲存，表單已保留。請確認瀏覽器儲存空間後重試。');}finally{bodySaving=false;if(tab==='body')render();}}
async function showReport(id,name){try{const stored=tempReports.has(id)?{file:tempReports.get(id)}:await reportStore('get',id);if(!stored?.file){toast('找不到原始報告，請重新選擇檔案。');return;}if(reportURL)URL.revokeObjectURL(reportURL);reportURL=URL.createObjectURL(stored.file);document.getElementById('report-title').textContent=name||'原始報告';const host=document.getElementById('report-content');host.replaceChildren();const isPDF=stored.file.type==='application/pdf'||/\.pdf$/i.test(name);const media=document.createElement(isPDF?'iframe':'img');media.src=reportURL;if(isPDF)media.title='InBody 原始報告';else media.alt='已儲存的 InBody 報告';host.appendChild(media);const link=document.getElementById('report-download');link.href=reportURL;link.download=name||'inbody-report';document.getElementById('report-dialog').showModal();}catch{toast('無法讀取報告，請確認此瀏覽器的附件資料仍存在。');}}

function setMealDate(date){if(!dateValid(date))return;if(mealIsDirty()&&!confirm('切換日期會放棄尚未儲存的飲食表單，確定切換？')){const input=document.getElementById('food-date');if(input)input.value=mealDate;return;}mealDate=date;mealDraft=freshMeal();render();}
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.body&&el.dataset.body!=='unit'){bodyDraft[el.dataset.body]=el.type==='checkbox'?el.checked:el.value;}if(el.dataset.meal)mealDraft[el.dataset.meal]=el.value;});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='inbody-file')beginOCR(el.files[0]);if(el.id==='food-date'&&el.checkValidity())setMealDate(el.value);if(el.dataset.body==='unit'){const next=el.value,old=bodyDraft.unit;if(next!==old){for(const k of ['weight','muscle'])if(bodyDraft[k]!==''&&Number.isFinite(Number(bodyDraft[k])))bodyDraft[k]=String(round1(Number(bodyDraft[k])*(next==='kg'?KG_PER_LB:1/KG_PER_LB)));bodyDraft.unit=next;render();}}});
document.addEventListener('submit',event=>{const form=event.target;if(form.id==='body-form'){event.preventDefault();saveBody(form);}if(form.id==='meal-form'){event.preventDefault();if(!form.reportValidity())return;const food=mealDraft.food.trim();if(!food){toast('請填寫飲食內容。');return;}const record={...mealDraft,food,id:mealDraft.id||uid()};const list=state.meals[mealDate]||(state.meals[mealDate]=[]),i=list.findIndex(r=>r.id===record.id);if(i>=0)list[i]=record;else list.push(record);save();mealDraft=freshMeal();render();toast(savedMessage('飲食紀錄已儲存'));}});
document.addEventListener('click',async event=>{const b=event.target.closest('[data-health]');if(!b||b.disabled)return;const a=b.dataset.health;
if(a==='cancel-ocr'){cancelOCR();return;}if(a==='close-report'){document.getElementById('report-dialog').close();return;}if(a==='view-report'){await showReport(b.dataset.id,b.dataset.name);return;}
if(a==='reset-body'){if(ocrJob||bodySaving)return;bodyDraft=freshBody();pendingReport=null;render();}
if(a==='edit-body'){if(ocrJob||bodySaving){toast('請等辨識或儲存完成。');return;}if((pendingReport||BODY_FIELDS.some(([k])=>bodyDraft[k]!==''))&&!confirm('放棄目前尚未儲存的量測表單，開啟這筆紀錄？'))return;bodyDraft={...freshBody(),...clone(state.body.find(r=>r.id===b.dataset.id)),reviewed:true};pendingReport=null;render();}
if(a==='delete-body'){if(ocrJob||bodySaving){toast('請等辨識或儲存完成。');return;}if(!confirm('刪除此筆身體紀錄及其報告？'))return;const r=state.body.find(r=>r.id===b.dataset.id);state.body=state.body.filter(v=>v.id!==r.id);const persisted=save();if(bodyDraft.id===r.id){bodyDraft=freshBody();pendingReport=null;}if(r.reportId&&persisted)await reportStore('delete',r.reportId).catch(()=>{});render();toast(savedMessage('已刪除身體紀錄'));}
if(a==='reset-meal'){mealDraft=freshMeal();render();}if(a==='meal-date')setMealDate(b.dataset.date);
if(a==='edit-meal'){if(mealIsDirty()&&!confirm('放棄目前尚未儲存的飲食表單，開啟這筆紀錄？'))return;mealDraft=clone(state.meals[mealDate].find(r=>r.id===b.dataset.id));render();}
if(a==='delete-meal'){if(!confirm('刪除這筆飲食紀錄？'))return;state.meals[mealDate]=state.meals[mealDate].filter(r=>r.id!==b.dataset.id);if(mealDraft.id===b.dataset.id)mealDraft=freshMeal();save();render();toast(savedMessage('已刪除飲食紀錄'));}
});
if(migrated){const note=document.createElement('div');note.className='migration-note';note.textContent='訓練重量已由公斤換算為磅（lb），四捨五入至小數一位；原始公斤資料已在此瀏覽器保留備份。';document.getElementById('storage-warning').after(note);}
</script>
</body>
</html>
